<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prompt Vault">
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="#f7f4ee"/>

  <!-- Back tile (brand gradient) -->
  <rect x="12" y="12" width="32" height="32" rx="8" fill="url(#brand)" filter="url(#shadow)"/>
  
  <!-- Front tile (white gallery card) -->
  <rect x="24" y="24" width="28" height="28" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Abstract image placeholder -->
  <rect x="28" y="28" width="20" height="12" rx="3" fill="#0f766e" opacity="0.1"/>
  <circle cx="38" cy="34" r="3" fill="#0f766e" opacity="0.8"/>

  <!-- Abstract text lines -->
  <rect x="28" y="43" width="14" height="3" rx="1.5" fill="#0f766e" opacity="0.9"/>
  <rect x="28" y="48" width="8" height="2" rx="1" fill="#64748b" opacity="0.6"/>
</svg>
