<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="panel hero-copy">
        <div class="eyebrow">用途別テンプレート / ローカルDB / コピー中心</div>
        <h1>Prompt Vault</h1>
        <p class="lead">作業ごとにテンプレートを選び、全文をそのままコピーするだけの最小サイトです。</p>
      </div>
    </section>

    <section class="workspace">
      <aside class="panel sidebar">
        <div class="head">
          <div>
            <div class="subtle">テンプレート</div>
            <h2>作業を選ぶ</h2>
          </div>
        </div>
        <input id="search" class="search" placeholder="検索: タイトル / 目的 / ブロックID" />
        <div class="list" id="list"></div>
      </aside>

      <section class="panel detail">
        <div class="head">
          <div>
            <div class="subtle">完成イメージ</div>
            <h2 id="detail-title">テンプレートを選択</h2>
          </div>
        </div>

        <section class="preview-stage" id="preview-stage">
          <div class="preview-stage__top">
            <div>
              <div class="preview-kicker" id="preview-kind">テンプレートを選択</div>
              <h3 id="preview-title">上の一覧から1つ選ぶ</h3>
              <p id="preview-purpose">ここに完成イメージの要点が出ます。</p>
            </div>
            <div class="preview-stats">
              <div>
                <span id="preview-block-count">0</span>
                <small>blocks</small>
              </div>
              <div class="preview-stats__note" id="preview-copy-format">全文の末尾に指示を追加</div>
            </div>
          </div>
          <div class="preview-stage__body">
            <div class="preview-stage__lead">
              <div class="subtle">完成後の見え方</div>
              <p id="preview-summary">一覧から選んでください。</p>
            </div>
            <div class="preview-stage__steps">
              <div class="subtle">組み立ての流れ</div>
              <div class="step-list" id="preview-steps"></div>
            </div>
          </div>
          <div class="preview-stage__chips" id="preview-blocks"></div>
        </section>

        <div class="block">
          <div class="subtle">要点</div>
          <div id="detail-summary" style="margin-top: 6px; line-height: 1.8;">一覧から選んでください。</div>
        </div>

        <div class="block">
          <div class="subtle">用途メモ</div>
          <div id="detail-notes" style="margin-top: 6px; line-height: 1.8;">一覧から選んでください。</div>
        </div>

        <div class="blocks" id="block-list"></div>

        <div class="block">
          <div class="head" style="margin:0 0 6px 0;">
            <div>
              <div class="subtle">全文</div>
              <h3 style="margin:4px 0 0;">組み立て済みパック</h3>
            </div>
            <button class="button primary" id="copy-full">全文コピー</button>
          </div>
          <pre id="detail-full"></pre>
        </div>

        <div class="buttons">
          <button class="button" id="copy-title">タイトルコピー</button>
          <button class="button" id="copy-purpose">用途コピー</button>
          <button class="button" id="copy-blocks">ブロックIDコピー</button>
        </div>

        <div class="status" id="status"></div>
      </section>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
