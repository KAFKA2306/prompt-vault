<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Prompt Vault">
  <defs>
    <radialGradient id="grad1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad3" cx="60%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#efebe4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#111827" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>
  <rect width="1200" height="630" fill="url(#grad3)"/>

  <!-- Main Panel -->
  <rect x="70" y="70" width="1060" height="490" rx="40" fill="#ffffff" fill-opacity="0.92" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Eyebrow Tag -->
  <rect x="130" y="130" width="180" height="40" rx="20" fill="#0f766e" fill-opacity="0.08" stroke="#0f766e" stroke-opacity="0.16" stroke-width="1"/>
  <text x="220" y="155" fill="#0f766e" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">PROMPT VAULT</text>

  <!-- Main Headline -->
  <text x="130" y="255" fill="#111827" font-family="Georgia, serif" font-size="62" font-weight="700" letter-spacing="-2">画像生成プロンプトを</text>
  <text x="130" y="335" fill="#111827" font-family="Georgia, serif" font-size="62" font-weight="700" letter-spacing="-2">分解・検索・全文コピー</text>

  <!-- Description / Stats -->
  <text x="130" y="415" fill="#5b6472" font-family="system-ui, sans-serif" font-size="22">VTuber, SNS, reaction images, character sheets, banners</text>
  <text x="130" y="455" fill="#8c97a7" font-family="system-ui, sans-serif" font-size="20">104 blocks / 50 templates / 55 images</text>

  <!-- Right side illustration -->
  <g transform="translate(740, 130)">
    <!-- Base accent card representing the gallery -->
    <rect x="0" y="0" width="330" height="370" rx="28" fill="url(#accent)" filter="url(#shadow)"/>
    
    <!-- Floating features list -->
    <rect x="30" y="40" width="310" height="68" rx="20" fill="#ffffff" fill-opacity="0.95" filter="url(#soft-shadow)"/>
    <text x="80" y="82" fill="#0f766e" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Search by intent</text>
    <circle cx="56" cy="74" r="6" fill="#0f766e"/>

    <rect x="30" y="124" width="310" height="68" rx="20" fill="#ffffff" fill-opacity="0.95" filter="url(#soft-shadow)"/>
    <text x="80" y="166" fill="#0f766e" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Copy full prompts</text>
    <circle cx="56" cy="158" r="6" fill="#0f766e"/>

    <rect x="30" y="208" width="310" height="68" rx="20" fill="#ffffff" fill-opacity="0.95" filter="url(#soft-shadow)"/>
    <text x="80" y="250" fill="#0f766e" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Recombine blocks</text>
    <circle cx="56" cy="242" r="6" fill="#0f766e"/>

    <!-- Small badge -->
    <rect x="30" y="296" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.2"/>
    <text x="95" y="319" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">Gallery First</text>
  </g>
</svg>
