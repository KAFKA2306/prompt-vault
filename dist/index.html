<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Vault | 2026 Edition</title>
  <meta name="description" content="Prompt Vault は、2026年基準の洗練されたUI/UXを備えたプロンプト保管庫です。" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="subtle-label">Vault & Generator</div>
      <h1>Prompt Vault</h1>
      <p class="hero-desc">
        テンプレート一覧から選び、詳細表示で全文をコピーする保管庫です。<br>
        必要なら指示を足して生成もできます。
      </p>
    </header>

    <section id="skills-section">
      <div class="section-head">
        <h2>Skills</h2>
        <a class="subtle-label" href="/docs/SKILLS.md" target="_blank" rel="noreferrer">Open index</a>
      </div>
      <div id="skills-rail" class="skills-rail"></div>
    </section>

    <section id="gallery-section">
      <div class="section-head">
        <h2>Templates</h2>
        <div class="subtle-label" id="template-count">0 items</div>
      </div>
      <div class="gallery-search">
        <input id="search" class="search" placeholder="検索: タイトル / 目的..." autocomplete="off" />
      </div>
      <div class="template-rail" id="template-rail">
        <!-- Templates injected here -->
      </div>
    </section>

    <section id="generator-section">
      <div class="section-head">
        <h2>Generator</h2>
        <div class="subtle-label">Build with Nodes</div>
      </div>
      <div class="generator-view">
        <div class="generator-form">
          <div class="field">
            <label for="generator-template">ベーステンプレート</label>
            <select id="generator-template"></select>
          </div>
          <div class="field">
            <label>ノード選択 (<span id="generator-node-count">0</span>件選択中)</label>
            <div id="generator-node-picker" class="tagrow generator-node-picker"></div>
            <div id="generator-selected-nodes" class="tagrow"></div>
          </div>
          <div class="field">
            <label for="generator-instruction">追加指示</label>
            <textarea id="generator-instruction" rows="3" placeholder="例: 朝向けに短く、やわらかくして"></textarea>
          </div>
          <div class="generator-actions">
            <button class="button primary" id="generator-submit">生成する</button>
            <button class="button" id="generator-copy" disabled>結果をコピー</button>
            <button class="button" id="generator-reset-template">リセット</button>
          </div>
          <div class="generator-result">
            <div class="field">
              <label>生成結果</label>
              <pre id="generator-output">まだ生成されていません。</pre>
            </div>
            <div id="generator-status" class="subtle-label"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="modal-close" id="modal-close">&times;</div>
    <div class="modal-back" id="modal-back">&larr; 戻る</div>
      <div class="modal-content" id="modal-content">
      <div class="modal-top">
        <div class="modal-image-view">
          <img id="modal-img" src="" alt="" class="modal-main-img" />
          <audio id="modal-audio" controls class="modal-main-audio"></audio>
          <div id="modal-artifacts" class="tagrow modal-artifacts-row"></div>
        </div>
        <div class="modal-info">
          <header class="modal-header">
            <div id="modal-kind" class="template-card__kind">Category</div>
            <h2 id="modal-title" class="modal-title-text">Title</h2>
            <p id="modal-purpose" class="modal-purpose-text">Purpose</p>
          </header>
          <button class="button primary modal-copy-btn" id="modal-copy">プロンプトをコピー</button>
          <div class="field">
            <label>構成要素</label>
            <div id="modal-primary" class="tagrow"></div>
          </div>
          <div class="field">
            <label id="modal-prompt-label">全文プロンプト</label>
            <pre id="modal-prompt"></pre>
          </div>
        </div>
      </div>
      <div id="modal-related-block" class="modal-related-section">
        <div class="subtle-label modal-related-label">似た構成のプロンプト</div>
        <div id="modal-related" class="modal-related-list"></div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
<!-- Build: 9dedfe7 -->
</body>
</html>
