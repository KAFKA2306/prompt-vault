app:
  host: 127.0.0.1
  port: 8787

model: gemini-2.5-flash-lite

paths:
  db: db/prompts.json
  static: static
  dist: dist
  artifacts: artifacts
  orphaned_artifacts: artifacts/_orphaned
  prompts: prompts/frontend_codex.md
  skills_index: docs/SKILLS.md

audit_literals:
  README.md:
    - docs/ARCHITECTURE.md
    - docs/SCHEMA.md
    - docs/OPERATIONS.md
    - docs/VALIDATION.md
  AGENTS.md:
    - scripts/guard_destructive.sh
  docs/README.md:
    - ARCHITECTURE.md
    - SCHEMA.md
    - OPERATIONS.md
    - VALIDATION.md
  docs/ARCHITECTURE.md:
    - db/prompts.json
    - designs/*.svg
    - assets/generated/
    - build.py
    - dist/
  docs/SCHEMA.md:
    - src/prompt_db.py
    - voice_caption
    - voice_script
    - generated
  docs/OPERATIONS.md:
    - scripts/artifacts/register_generated_artifact.py
    - task deliver
  docs/VALIDATION.md:
    - scripts/validate_db.py
    - scripts/audit_db.py
    - scripts/audit_artifacts.py
    - .github/workflows/deploy.yml
  docs/SKILLS.md:
    - .agents/skills/prompt-db-auditor/SKILL.md
    - .agents/skills/workflow/SKILL.md
    - .agents/skills/tts-validate/SKILL.md
  scripts/guard_destructive.sh:
    - git clean -fdn
    - "BLOCKED: git clean would remove files."
  .github/workflows/deploy.yml:
    - scripts/audit_repository_storage.py
    - scripts/validate_db.py
    - scripts/audit_db.py
    - scripts/audit_artifacts.py
    - git ls-files dist tmp
    - build.py
