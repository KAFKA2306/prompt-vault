name: KAFKA RESULTS

on:
  pull_request:
    paths:
      - "scripts/results/**"
      - "tests/test_collect_*.py"
      - "tests/test_aggregate_results.py"
      - "tests/test_results_pipeline_contract.py"
      - "docs/results-*.md"
      - ".github/workflows/results-aggregate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/results/**"
      - "tests/test_collect_*.py"
      - "tests/test_aggregate_results.py"
      - "tests/test_results_pipeline_contract.py"
      - "docs/results-*.md"
      - ".github/workflows/results-aggregate.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

concurrency:
  group: kafka-results-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: collect / ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: code-quality
            script: code_quality
          - category: data-quality
            script: data_quality
          - category: reliability
            script: reliability
          - category: automation
            script: automation
          - category: adoption
            script: adoption
          - category: business
            script: business
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/results
            tests
            docs/results-*.md
            .github/workflows/results-aggregate.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_collect_${{ matrix.script }}.py'
      - name: Emit repo-native unittest evidence
        if: matrix.category == 'code-quality'
        run: |
          python -m scripts.results.emit_native_test_metric \
            --test-file tests/test_collect_code_quality.py \
            --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out results/native/prompt-vault.json
      - name: Collect code-quality reports
        if: matrix.category == 'code-quality'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/results/collect_code_quality.py \
            --owner KAFKA2306 \
            --out results/code-quality \
            --native-metrics results/native
      - name: Collect reports
        if: matrix.category != 'code-quality'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/results/collect_${{ matrix.script }}.py --owner KAFKA2306 --out results/${{ matrix.category }}
      - name: Validate snapshot
        run: python scripts/results/validate_snapshot.py '${{ matrix.category }}'
      - name: Upload domain snapshot
        uses: actions/upload-artifact@v7
        with:
          name: kafka-results-${{ matrix.category }}
          path: |
            results/${{ matrix.category }}/*.json
            results/native/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify clean checkout
        run: |
          rm -rf results tests/__pycache__ scripts/__pycache__ scripts/results/__pycache__
          test -z "$(git status --porcelain --untracked-files=all)"

  aggregate:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/results/aggregate.py
            tests/test_aggregate_results.py
            tests/test_results_pipeline_contract.py
            docs/results-aggregate.md
            .github/workflows/results-aggregate.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest -v tests.test_aggregate_results tests.test_results_pipeline_contract
      - name: Download this run's domain snapshots
        uses: actions/download-artifact@v7
        with:
          pattern: kafka-results-*
          path: results
          merge-multiple: true
      - name: Aggregate results
        run: python scripts/results/aggregate.py --root results --require-all
      - name: Contract audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('results')
          data = json.loads((root / 'results.json').read_text())
          assert data['schema_version'] == 'kafka.results.aggregate.v1'
          assert data['contract']['unknown_is_zero'] is False
          assert data['contract']['not_available_is_zero'] is False
          assert data['contract']['cross_metric_score_created'] is False
          assert len(data['views']['by_category']) == 6
          assert data['results'], 'empty aggregate is forbidden'
          ids = [row['canonical_result_id'] for row in data['results']]
          assert len(ids) == len(set(ids)), 'duplicate canonical result id'
          for row in data['results']:
              assert row['category'] in {'code-quality','data-quality','reliability','automation','adoption','business'}
              assert len(row['input_sha256']) == 64
              int(row['input_sha256'], 16)
              assert Path(row['source_path']).exists(), row['source_path']
              for url in row['evidence_urls']:
                  assert url.startswith(('https://', 'http://'))
          snapshots = sorted((root / 'snapshots').glob('*.json'))
          assert snapshots, 'daily snapshot missing'
          snapshot = json.loads(snapshots[-1].read_text())
          assert snapshot == data
          markdown = (root / 'RESULTS.md').read_text()
          assert '# KAFKA RESULTS' in markdown
          assert 'Unknown, not-instrumented' in markdown
          schema = json.loads((root / 'schema.json').read_text())
          assert schema['properties']['schema_version']['const'] == 'kafka.results.aggregate.v1'
          print(f"validated {len(data['results'])} canonical results across {len(data['views']['by_repository'])} repositories")
          PY
      - name: Upload canonical aggregate snapshot
        uses: actions/upload-artifact@v7
        with:
          name: kafka-results-aggregate
          path: |
            results/results.json
            results/RESULTS.md
            results/schema.json
            results/snapshots/*.json
          retention-days: 30
      - name: Verify clean checkout
        run: |
          rm -rf results tests/__pycache__ scripts/__pycache__ scripts/results/__pycache__
          test -z "$(git status --porcelain --untracked-files=all)"
