name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv run scripts/validate_db.py
      - run: uv run build.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-production:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed page
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 0 "$PAGE_URL" -o /tmp/index.html
          grep -F "Prompt Vault" /tmp/index.html
          DESIGN_URL="${PAGE_URL%/}/designs/issue-91-blueprint-proof.svg"
          curl --fail --silent --show-error --location --retry 0 "$DESIGN_URL" -o /tmp/issue-91-blueprint-proof.svg
          grep -F "設計図派" /tmp/issue-91-blueprint-proof.svg
          grep -F 'font-family="Noto Sans CJK JP, sans-serif"' /tmp/issue-91-blueprint-proof.svg
