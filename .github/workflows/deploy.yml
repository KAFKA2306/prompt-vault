name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify generated output is untracked
        run: test -z "$(git ls-files dist tmp)"
      - name: Audit tracked repository storage
        run: python scripts/audit_repository_storage.py --max-bytes 891289600 --max-file-bytes 67108864
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Audit canonical documentation
        run: uv run python scripts/audit_literals.py
      - name: Verify weekly macro delivery contract
        run: uv run python -m unittest -v tests.test_weekly_power_macro_contract
      - name: Smoke-check canonical artifact registration
        run: uv run python scripts/artifacts/register_generated_artifact.py --help
      - name: Install canonical SVG font
        run: sudo apt-get update && sudo apt-get install --yes fonts-noto-cjk
      - name: Validate prompt database and canonical designs
        run: uv run python scripts/validate_db.py
      - name: Audit prompt database structure
        run: uv run python scripts/audit_db.py
      - name: Audit artifact connectivity
        run: uv run python scripts/audit_artifacts.py
      - name: Build static site
        run: uv run build.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-production:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed page
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 0 "$PAGE_URL" -o /tmp/index.html
          grep -F "Prompt Vault" /tmp/index.html
          DESIGN_URL="${PAGE_URL%/}/designs/issue-91-blueprint-proof.svg"
          curl --fail --silent --show-error --location --retry 0 "$DESIGN_URL" -o /tmp/issue-91-blueprint-proof.svg
          grep -F "設計図派" /tmp/issue-91-blueprint-proof.svg
          grep -F 'font-family="Noto Sans CJK JP, sans-serif"' /tmp/issue-91-blueprint-proof.svg
          ASSET_URL="${PAGE_URL%/}/assets/generated/issue-91-business-analyst.jpg"
          curl --fail --silent --show-error --location --retry 0 "$ASSET_URL" -o /tmp/issue-91-business-analyst.jpg
          test -s /tmp/issue-91-business-analyst.jpg
          THIS_WEEK_URL="${PAGE_URL%/}/designs/issue-91-market-thisweek.svg"
          curl --fail --silent --show-error --location --retry 0 "$THIS_WEEK_URL" -o /tmp/issue-91-market-thisweek.svg
          grep -F "今週の市場" /tmp/issue-91-market-thisweek.svg
          grep -F '../assets/generated/issue-91-business-analyst.jpg' /tmp/issue-91-market-thisweek.svg
          NEXT_WEEK_URL="${PAGE_URL%/}/designs/issue-91-market-nextweek.svg"
          curl --fail --silent --show-error --location --retry 0 "$NEXT_WEEK_URL" -o /tmp/issue-91-market-nextweek.svg
          grep -F "来週の市場" /tmp/issue-91-market-nextweek.svg
          grep -F '../assets/generated/issue-91-business-analyst.jpg' /tmp/issue-91-market-nextweek.svg
