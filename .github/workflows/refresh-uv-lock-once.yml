name: Refresh uv lock once

on:
  push:
    branches: ["refactor/remove-unused-selenium"]
    paths:
      - "pyproject.toml"
      - ".github/workflows/refresh-uv-lock-once.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-unused-selenium
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Refresh lockfile
        run: uv lock
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "refresh uv lock after selenium removal"
          git push origin HEAD:refactor/remove-unused-selenium
