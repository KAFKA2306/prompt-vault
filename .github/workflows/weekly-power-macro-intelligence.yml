name: Weekly Power & Macro Intelligence

on:
  workflow_dispatch:
    inputs:
      week_end:
        description: "Week end date, YYYY-MM-DD. Empty means runner date."
        required: false
        default: ""
      publish:
        description: "Publish GitHub Issue"
        required: false
        default: "true"
  schedule:
    # 22:00 UTC Friday == 07:00 JST Saturday.
    - cron: "0 22 * * 5"

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-power-macro-intelligence
  cancel-in-progress: false

jobs:
  weekly-power-macro-intelligence:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    env:
      WEEKLY_POWER_MACRO_REPO: ${{ github.repository }}
      PUBLISH_WEEKLY_POWER_MACRO: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'true' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify local agy runtime
        run: |
          which agy
          timeout 60 agy --version
          which gh
          gh auth status
          python3 --version
          bash --version
          date -d "2026-07-04 -6 days" +%F
          timeout 180 agy --dangerously-skip-permissions --print 'Return exactly: AGY_OK'

      - name: Run Weekly Power & Macro Intelligence
        run: |
          if [ -n "${{ inputs.week_end }}" ]; then
            bash scripts/run_weekly_power_macro_intelligence.sh --week-end "${{ inputs.week_end }}"
          else
            bash scripts/run_weekly_power_macro_intelligence.sh
          fi

      - name: Commit generated report artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/weekly-power-macro-intelligence docs/reports/weekly-power-macro-intelligence
          if git diff --cached --quiet; then
            echo "No report artifact changes to commit."
          else
            git commit -m "chore: add weekly power macro intelligence report"
            git push || echo "git push failed; report artifacts were generated and issue publication already ran"
          fi
