name: KAFKA RESULTS adoption

on:
  pull_request:
    paths:
      - "scripts/collect_adoption.py"
      - "tests/test_collect_adoption.py"
      - ".github/workflows/results-adoption.yml"
      - "docs/results-adoption.md"
  push:
    branches: [main]
    paths:
      - "scripts/collect_adoption.py"
      - "tests/test_collect_adoption.py"
      - ".github/workflows/results-adoption.yml"
      - "docs/results-adoption.md"
  workflow_dispatch:
  schedule:
    - cron: "41 1 * * *"

permissions:
  contents: read

jobs:
  adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/collect_adoption.py
            tests/test_collect_adoption.py
            docs/results-adoption.md
            .github/workflows/results-adoption.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_collect_adoption.py'
      - name: Collect adoption reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_adoption.py --owner KAFKA2306 --out results/adoption
      - name: Contract audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('results/adoption').glob('*.json'))
          assert files, 'no adoption reports generated'
          for path in files:
              data = json.loads(path.read_text())
              assert data['schema_version'] == 'kafka.results.adoption.v1'
              assert data['measurement_contract']['real_usage_and_proxy_separated'] is True
              assert data['measurement_contract']['unobserved_usage_is_zero'] is False
              for metric in data['observed_usage'].values():
                  assert metric['value'] is None
                  assert metric['status'] == 'not_instrumented'
              for key in ('github_stars', 'github_forks'):
                  metric = data['proxy_metrics'][key]
                  assert metric['kind'] == 'proxy'
                  assert metric['not_equivalent_to'] == 'users_or_usage'
              assert data['periods']['7d']['status'] == 'not_instrumented'
              assert data['periods']['30d']['status'] == 'not_instrumented'
              assert data['provenance']['source_system'] == 'GitHub REST API'
              assert data['provenance']['repository_url']
          print(f'validated {len(files)} repository reports')
          PY
      - name: Upload adoption snapshot
        uses: actions/upload-artifact@v4
        with:
          name: kafka-results-adoption
          path: results/adoption/*.json
          retention-days: 30
      - name: Verify clean checkout
        run: |
          rm -rf results/adoption tests/__pycache__ scripts/__pycache__
          test -z "$(git status --porcelain --untracked-files=all)"
