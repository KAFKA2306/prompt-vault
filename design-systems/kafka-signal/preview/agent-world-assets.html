<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../tokens.css">
  <title>Agent World assets · KAFKA SIGNAL</title>
  <style>
    body{margin:0;background:var(--ks-canvas);color:var(--ks-ink);font:1rem/1.6 var(--ks-font-body)}
    main{max-width:76rem;margin:auto;padding:2rem 1rem 4rem}
    a{color:inherit}.lead{max-width:48rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:1rem;margin-top:1.5rem}
    figure{margin:0;padding:1rem;border:1px solid color-mix(in srgb,var(--ks-ink) 14%,transparent);border-radius:1rem;background:color-mix(in srgb,var(--ks-canvas) 92%,white);display:grid;gap:.75rem;align-content:start}
    figure img{display:block;width:100%;height:8rem;object-fit:contain}
    figcaption{display:grid;gap:.25rem}code{font-size:.75rem;overflow-wrap:anywhere}.category{margin-top:2rem}
  </style>
</head>
<body>
<main>
  <p><a href="./index.html">← KAFKA SIGNAL preview</a></p>
  <h1>Agent World asset pack</h1>
  <p class="lead">GitHub由来の情報を置き換えず、Live Agent Worldの役割・状態・作業場所を可愛く見せる装飾assetです。work itemのkindとlaneから機械的に選択します。workerはKafka本人キャラクターではありません。</p>

  <h2 class="category">Role</h2>
  <div class="grid">
    <figure><img src="../assets/agent-world/agent-world-role-issue-working.svg" alt=""><figcaption><strong>Issue worker</strong><code>agent-world.role.issue-working</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-role-pr-review.svg" alt=""><figcaption><strong>PR reviewer</strong><code>agent-world.role.pull-request-review</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-role-workflow-terminal.svg" alt=""><figcaption><strong>Workflow terminal</strong><code>agent-world.role.workflow-terminal</code></figcaption></figure>
  </div>

  <h2 class="category">State</h2>
  <div class="grid">
    <figure><img src="../assets/agent-world/agent-world-state-working.svg" alt=""><figcaption><strong>Working</strong><code>agent-world.state.working</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-state-waiting.svg" alt=""><figcaption><strong>Waiting</strong><code>agent-world.state.waiting</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-state-done.svg" alt=""><figcaption><strong>Done</strong><code>agent-world.state.done</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-state-failed.svg" alt=""><figcaption><strong>Failed / attention</strong><code>agent-world.state.failed</code></figcaption></figure>
  </div>

  <h2 class="category">Scene</h2>
  <div class="grid">
    <figure><img src="../assets/agent-world/agent-world-scene-desk.svg" alt=""><figcaption><strong>Desk</strong><code>agent-world.scene.desk</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-scene-review-bench.svg" alt=""><figcaption><strong>Review bench</strong><code>agent-world.scene.review-bench</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-scene-station-sign.svg" alt=""><figcaption><strong>Station sign</strong><code>agent-world.scene.station-sign</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-scene-floor-tile.svg" alt=""><figcaption><strong>Floor tile</strong><code>agent-world.scene.floor-tile</code></figcaption></figure>
    <figure><img src="../assets/agent-world/agent-world-scene-terminal.svg" alt=""><figcaption><strong>CI terminal</strong><code>agent-world.scene.terminal</code></figcaption></figure>
  </div>
</main>

</html>
