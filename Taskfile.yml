version: '3'

tasks:
  run:
    desc: Run the development server
    cmds:
      - uv run app.py

  build:
    desc: Build the static site
    cmds:
      - uv run build.py

  validate:
    desc: Validate the database
    cmds:
      - python3 scripts/validate_db.py

  artifacts-audit:
    desc: Audit artifact connectivity
    cmds:
      - python3 scripts/audit_artifacts.py

  literals-audit:
    desc: Audit required literal paths and references
    cmds:
      - python3 scripts/audit_literals.py

  lint:
    desc: Lint the project
    cmds:
      - uv run ruff check src

  format:
    desc: Format the project
    cmds:
      - uv run ruff format src

  verify:
    desc: Verify the pages
    cmds:
      - bash scripts/verify_pages.sh
  test:
    desc: Run all tests and validation
    cmds:
      - task: lint
      - task: format
      - task: deliver

  deliver:
    desc: Run the Prompt Vault delivery workflow
    cmds:
      - task: literals-audit
      - task: validate
      - task: artifacts-audit
      - task: build
