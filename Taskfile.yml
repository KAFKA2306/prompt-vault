version: '3'

tasks:
  run:
    desc: Run the development server
    cmds:
      - uv run app.py

  build:
    desc: Build the static site and compact Kafka ideation profile
    cmds:
      - uv run build.py

  ideation:
    desc: Retrieve evidence-backed Kafka ideation examples; usage: task ideation -- "query"
    deps: [build]
    cmds:
      - uv run python scripts/ideation.py "{{.CLI_ARGS}}"

  validate:
    desc: Validate the database
    cmds:
      - python3 scripts/validate_db.py
      - python3 scripts/audit_db.py

  artifacts-audit:
    desc: Audit artifact connectivity
    cmds:
      - python3 scripts/audit_artifacts.py

  literals-audit:
    desc: Audit required literal paths and references
    cmds:
      - python3 scripts/audit_literals.py

  lint:
    desc: Lint the project
    cmds:
      - uv run ruff check src

  format:
    desc: Format the project
    cmds:
      - uv run ruff format src

  verify:
    desc: Verify the pages
    cmds:
      - bash scripts/verify_pages.sh

  ideation-smoke:
    desc: Verify the built Kafka ideation index is queryable
    cmds:
      - test -s dist/data/ideation_profile.json
      - uv run python scripts/ideation.py "画像生成" --profile dist/data/ideation_profile.json --limit 1 > /tmp/ideation.json
      - uv run python -c 'import json; d=json.load(open("/tmp/ideation.json")); assert d["reference_examples"]; assert d["seed"]["trait_tags"]'

  test:
    desc: Run all tests and validation
    cmds:
      - task: lint
      - task: format
      - task: deliver

  deliver:
    desc: Run the Prompt Vault delivery workflow
    cmds:
      - task: literals-audit
      - task: validate
      - task: artifacts-audit
      - task: build
      - task: ideation-smoke
